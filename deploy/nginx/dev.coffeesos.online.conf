# CoffeeSOS API (dev) - https://dev.coffeesos.online/api
# Install: copy to /etc/nginx/conf.d/, `nginx -t && systemctl reload nginx`,
# then `certbot --nginx -d dev.coffeesos.online --redirect` adds the TLS block.
# The API container listens on 127.0.0.1:8080 (docker compose, API_BIND=127.0.0.1).

upstream coffeesos_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    server_name dev.coffeesos.online;
    listen 80;
    listen [::]:80;

    client_max_body_size 10m;   # logo / menu image uploads later

    # WebSocket hub: backend serves it at /ws, exposed here as /api/ws
    location = /api/ws {
        proxy_pass http://coffeesos_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health: backend serves it at /healthz, exposed here as /api/healthz
    location = /api/healthz {
        proxy_pass http://coffeesos_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # REST API: backend routes already start with /api/v1, URI passed unchanged
    location /api/ {
        proxy_pass http://coffeesos_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Admin web: static SPA (React/Vite, base /admin/) published to /var/www/dev.coffeesos.online/admin
    root /var/www/dev.coffeesos.online;

    location = /admin {
        return 301 /admin/;
    }

    location /admin/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    # Staff POS: Flutter web (base-href /staff/) published to /var/www/dev.coffeesos.online/staff
    # Flutter's main.dart.js / flutter_bootstrap.js are not content-hashed, so the
    # shell files stay no-cache; canvaskit and bundled assets can be cached.
    location = /staff {
        return 301 /staff/;
    }

    location /staff/canvaskit/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /staff/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location /staff/ {
        try_files $uri $uri/ /staff/index.html;
        add_header Cache-Control "no-cache";
    }

    location = / {
        return 302 /admin/;
    }

    location / {
        return 404;
    }
}
